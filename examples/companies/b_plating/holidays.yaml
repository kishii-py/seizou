# 休日の種 (2026 年)。祝日は国民の祝日の 2026 年の実際の日付、会社の休みは作り物。
# 定休日の曜日 (土日) は書かない (設定 weekly_holidays)。2 回入れても重ならない (日付が鍵)。
# 会社の休み (作り物。どれも平日): 年始 2 日 (01-02・01-05)・夏 3 日 (08-12〜08-14)・年末 4 日 (12-28〜12-31)。祝日 18 件と合わせて 27 件。
