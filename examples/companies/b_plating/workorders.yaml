# 指示書の種 (作り物)。受注の 11〜20 件目 (まだ出荷していない 10 件) の 1 行目の明細に 1 枚ずつ。
# 指示書の発行日は、読み込みの日になる (services が今日にする)。
# 数量はその明細の数量。工程は、その部品の item_processes.csv の並びのまま (予定の数は指示書の数量)。
# 計画に使う工程だけに開始日と終了日を置く (2026-11-02〜11-13 の平日。今週と来週に散らす)。
# 日を置かない指示書は、生産計画の盤の「未計画」の列に出る。
#
# 1 件は次の鍵を持つ。
#
#   - 得意先の取引先コード: partners.csv の取引先コード
#     得意先の注文番号: orders.yaml の得意先の注文番号
#     行番号: その受注の明細の行
#     数量: 指示書の数量
#     工程: 工程の並び (1 つ以上)
#       - 工程コード: processes.yaml の工程コード
#         予定の数: その工程で作る数
#         開始日・終了日: 工程の予定の日 (両方を書くか、両方を省く)
#
# 指示書の並び
