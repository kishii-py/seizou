# 1〜2 明細は 2 回に分けて出す (分納。合計が明細の数量)。
# 末尾の 3 件 (C001・PO-000001) は、A 社から受信した注文の写しの受注 (acceptances.yaml。受注の 21 件目) の出荷。日と数は
# A 社の出荷の知らせの種 (shipping_notices.yaml) と同じで、新しい置き場では出荷番号が SH-000022〜SH-000024 になる。
# 同じ明細に同じ日の出荷を 2 つ置かない (納品書と請求書が 受注の明細 × 出荷日 で指すため)。
