# つながりの種 (作り物)。注文をやり取りする取引先ごとに、相手の受け口と鍵の置き場を書く。
# 1 件は次の 4 つの鍵を持つ。鍵の名前は部品の表の日本語の項目名。
# 鍵の値 (署名に使う秘密の値) はここに書かない。値は会社のプロジェクトの .env だけに置く。
#
#   - 取引先コード: partners.csv の取引先コード
#     受け口の URL: 相手の受け口の URL
#     鍵の置き場の名前: 鍵の値を入れる環境変数の名前 (SEIZOU_PARTNER_<相手の会社の id を大文字にした物>_SECRET)
