<section>
<h2>請求書の新規登録</h2>
<p>得意先を選び、納品書の出た出荷をまとめて請求書を作る画面です。</p>
<ul>
<li>使う人: 経理</li>
<li>いつ: 締日の後</li>
<li>何のために: 得意先ごとに納品書の出た出荷をまとめて請求書を作る</li>
<li>次にすること: 請求書の詳細から印刷</li>
</ul>
<h3>できること</h3>
<ul>
<li>「得意先」を選ぶ。</li>
<li>「出荷」の並びから、請求に入れる出荷に印を付ける。納品書の出た出荷のうち、まだ請求書に入っていない物だけが並ぶ。</li>
<li>「発行日」を入れる。</li>
<li>「保存」で請求書を作る。「キャンセル」で保存せずに戻る。</li>
</ul>
<h3>注意</h3>
<ul>
<li>R09 請求書の明細は、出荷済みの物だけ。</li>
</ul>
</section>
