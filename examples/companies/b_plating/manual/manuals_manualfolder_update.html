<h2>名前と色の変更</h2>
<p>フォルダの名前と色を変える画面です。保護中のフォルダも変えられます。</p>
<ul>
<li>使う人: 全員</li>
<li>いつ: フォルダの名前や色を変えるとき</li>
<li>何のために: 名前と色を直す</li>
<li>次にすること: マニュアルの一覧へ戻る</li>
</ul>
<h3>できること</h3>
<ul>
<li>「名前」と「色」を直す。</li>
<li>「保存」で直す。「キャンセル」で直さずに戻る。</li>
<li>保護中のフォルダも、名前と色は変えられる。</li>
</ul>
</section>
