<section>
<h2>製造の完了を入庫にする</h2>
<p>発行の指示書を選び、完成した数を入庫にする画面です。完成の数は最後の工程の実績の合計で、指示書を選んで開くと残りの数が入ります。</p>
<ul>
<li>使う人: 製造・生産管理</li>
<li>いつ: 最後の工程が終わったとき</li>
<li>何のために: 完成した数を入庫にする</li>
<li>次にすること: 在庫に出る。出荷へ</li>
</ul>
<h3>できること</h3>
<ul>
<li>「指示書」を選ぶ。選んで開くと、残りの数が入る。</li>
<li>「数量」「日付」「備考」を入れる。</li>
<li>「保存」で入庫にする。「キャンセル」で保存せずに戻る。</li>
</ul>
</section>
