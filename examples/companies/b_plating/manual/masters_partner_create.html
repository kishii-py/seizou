<section>
<h2>取引先の新規登録</h2>
<p>新しい取引先を足す画面です。取引先コードは会社の中で 1 つだけです。</p>
<ul>
<li>使う人: 営業</li>
<li>いつ: 取引先が増えたとき</li>
<li>何のために: 得意先か協力企業を登録する</li>
<li>次にすること: 受注と発注で選べるようになる</li>
</ul>
<h3>できること</h3>
<ul>
<li>「取引先コード」「名前」「略称」を入れ、「取引先の種類」で得意先か協力企業かを選ぶ。</li>
<li>「締日」「支払の月」「支払日」で支払の条件を入れる。</li>
<li>「金額の端数の扱い」「消費税の端数の扱い」を選ぶ。</li>
<li>「保存」で取引先を足す。「キャンセル」で保存せずに戻る。</li>
</ul>
</section>
