<section>
<h2>マニュアル</h2>
<p>作業手順書と社内の文書をフォルダに分けて書き、版を残して育てる画面です。マニュアルの一覧で、フォルダと題が並びます。</p>
<ul>
<li>使う人: 全員</li>
<li>いつ: 手順を決めたときと、新人に教えるとき (書くのは各部署の担当)</li>
<li>何のために: 手順書と社内の文書を置き場ごとに持ち、育てる</li>
<li>次にすること: 読むなら行から、書くなら「新規登録」</li>
</ul>
<h3>できること</h3>
<ul>
<li>フォルダを開き、行を押してマニュアルを読む。</li>
<li>「新規登録」でマニュアルを作り、「新しいフォルダ」でフォルダを作る。</li>
<li>「キーワード」で探し、「絞り込み」を押す。「CSV」で書き出す。</li>
</ul>
</section>
