<section>
<h2>マニュアルの削除</h2>
<p>マニュアルを、版と画像と一緒に削除する画面です。削除したマニュアルは元に戻せません。</p>
<ul>
<li>使う人: 全員</li>
<li>いつ: 要らなくなったとき</li>
<li>何のために: 版と画像ごと削除する</li>
<li>次にすること: マニュアルの一覧へ戻る</li>
</ul>
<h3>できること</h3>
<ul>
<li>マニュアルを読む画面の「削除」から開く。</li>
<li>「削除」で、版と画像も一緒に削除する。元に戻せない。</li>
<li>「キャンセル」で削除せずに戻る。保護したマニュアルは削除できない。</li>
</ul>
</section>
