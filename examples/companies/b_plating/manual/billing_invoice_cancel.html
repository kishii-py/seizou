<section>
<h2>請求書を取り消す</h2>
<p>発行の請求書を取り消す画面です。明細は残ります。</p>
<ul>
<li>使う人: 経理</li>
<li>いつ: 請求を作り直すとき</li>
<li>何のために: 発行の請求書を取り消す</li>
<li>次にすること: 請求書を作り直す</li>
</ul>
<h3>できること</h3>
<ul>
<li>請求書の詳細の「取消」から開く。</li>
<li>「保存」で取り消す。「キャンセル」で取り消さずに戻る。</li>
<li>取り消した後は、「請求書の新規登録」で作り直す。</li>
</ul>
<h3>注意</h3>
<ul>
<li>R21 取消した請求書には、入金を記録できない。</li>
</ul>
</section>
