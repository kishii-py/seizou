<section>
<h2>フォルダの移動</h2>
<p>フォルダを中身ごと、ほかのフォルダの中かルートへ移す画面です。自分と自分の中のフォルダへは移せません。</p>
<ul>
<li>使う人: 全員</li>
<li>いつ: 置き場を整理するとき</li>
<li>何のために: フォルダを中身ごと移す</li>
<li>次にすること: マニュアルの一覧で確かめる</li>
</ul>
<h3>できること</h3>
<ul>
<li>「移動先」でフォルダかルートを選ぶ。</li>
<li>「保存」で中身ごと移す。「キャンセル」で移さずに戻る。</li>
<li>保護したフォルダは移せない。</li>
</ul>
</section>
