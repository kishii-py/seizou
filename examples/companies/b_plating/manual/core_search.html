<section>
<h2>検索</h2>
<p>品番・品名・注文番号や、マニュアルの題と本文の言葉で、部品マスター・受注・マニュアルを横断して探す画面です。行を押すと詳細へ移ります。</p>
<ul>
<li>使う人: 全員</li>
<li>いつ: 品番や注文番号で探すとき</li>
<li>何のために: 横断して探す</li>
<li>次にすること: 行を押して詳細へ</li>
</ul>
<h3>できること</h3>
<ul>
<li>欄に品番や品名や注文番号、マニュアルの中の言葉を入れ、「検索」を押す。</li>
<li>当たった行が、記録の種類ごとに並ぶ。</li>
<li>行を押すと、その記録の詳細へ移る。</li>
</ul>
</section>
