<section>
<h2>読み取りの詳細</h2>
<p>AI が読み取った注文書の中身を見る画面です。明細は得意先の品番のまま並べています。</p>
<ul>
<li>使う人: 営業</li>
<li>いつ: 読み取った中身を確かめるとき</li>
<li>何のために: 得意先の品番のままの明細を見る</li>
<li>次にすること: 「受注登録」へ</li>
</ul>
<h3>できること</h3>
<ul>
<li>「得意先」「得意先の注文番号」「読み取った人」「読み取った日時」「作った受注」を見る。</li>
<li>「明細 (得意先の品番のまま)」で、AI が読み取った品番と数量と納期を見る。</li>
<li>品番と数量と納期を注文書と見比べてから、「受注登録」へ移る。</li>
</ul>
</section>
