<h2>図面を版に戻す</h2>
<p>選んだ版の図面を今の図面に戻す画面です。戻す前の今の図面は新しい版として残ります。</p>
<ul>
<li>使う人: 生産管理</li>
<li>いつ: 差し替えた図面を前の版に戻すとき</li>
<li>何のために: 選んだ版を今の図面にする</li>
<li>次にすること: 図面ビューアで確かめる</li>
</ul>
<h3>できること</h3>
<ul>
<li>「戻す版」で戻したい版を選び、「備考」を入れる。</li>
<li>「保存」で戻す。戻す前の今の図面は新しい版として残る。</li>
<li>「ビューアに戻る」か「キャンセル」で、戻さずに戻る。</li>
</ul>
