<section>
<h2>発注を取り消す</h2>
<p>「作成」の発注を取り消す画面です。理由は備考の末尾に残ります。</p>
<ul>
<li>使う人: 生産管理</li>
<li>いつ: 発注が要らなくなったとき</li>
<li>何のために: 「作成」の発注を取り消す</li>
<li>次にすること: 発注の一覧へ戻る</li>
</ul>
<h3>できること</h3>
<ul>
<li>発注の詳細から開く。取り消せるのは、状態が「作成」の発注だけ。</li>
<li>「取消の理由」を書く。理由は備考の末尾に残る。</li>
<li>「保存」で取り消す。「キャンセル」で取り消さずに戻る。</li>
</ul>
</section>
