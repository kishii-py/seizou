<section>
<h2>工程</h2>
<p>工程の一覧です。「計画に使う」に印を付けた工程ごとに、生産計画の盤が並びます。</p>
<ul>
<li>使う人: 生産管理</li>
<li>いつ: 工程が増えたとき</li>
<li>何のために: 工程と「計画に使う」の印を持つ</li>
<li>次にすること: 印を付けた工程が生産計画の盤に出る</li>
</ul>
<h3>できること</h3>
<ul>
<li>「工程コード」「名前」「並び順」「計画に使う」を見る。</li>
<li>「新規登録」で工程を足す。</li>
<li>行を押すと工程の詳細へ移る。「CSV」で書き出す。</li>
</ul>
</section>
