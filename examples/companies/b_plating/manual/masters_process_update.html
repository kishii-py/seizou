<section>
<h2>工程の編集</h2>
<p>工程の項目を編集する画面です。「計画に使う」に印を付けると、生産計画の盤に出ます。</p>
<ul>
<li>使う人: 生産管理</li>
<li>いつ: 並び順や「計画に使う」を変えるとき</li>
<li>何のために: 工程の項目を直す</li>
<li>次にすること: 生産計画の盤で確かめる</li>
</ul>
<h3>できること</h3>
<ul>
<li>「工程コード」「名前」「並び順」を直す。</li>
<li>「計画に使う」と「協力企業に出すか」の印を付け外しする。</li>
<li>「保存」で直す。「キャンセル」で直さずに戻る。</li>
</ul>
</section>
