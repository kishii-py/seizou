<section>
<h2>工程の詳細</h2>
<p>工程の項目を見る画面です。「編集」で名前や並び順と「計画に使う」の印を変えられます。</p>
<ul>
<li>使う人: 生産管理</li>
<li>いつ: 工程の項目を確かめるとき</li>
<li>何のために: 名前・並び順・「計画に使う」を見る</li>
<li>次にすること: 「編集」へ</li>
</ul>
<h3>できること</h3>
<ul>
<li>「編集」で工程の項目を直す。</li>
<li>「添付ファイルを付ける」で作業の写真などを付ける。</li>
<li>「一覧に戻る」で工程へ戻る。</li>
</ul>
<h3 id="basic">基本情報</h3>
<p>「工程コード」「名前」「協力企業に出すか」「並び順」「計画に使う」を出します。計画に使う印のある工程は、生産計画の盤に出ます。</p>
</section>
