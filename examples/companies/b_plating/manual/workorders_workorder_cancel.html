<section>
<h2>指示書を取り消す</h2>
<p>指示書を取り消す画面です。実績の入った指示書は取り消せません。取消の指示書は、生産計画と進捗の盤から外れます。</p>
<ul>
<li>使う人: 生産管理</li>
<li>いつ: 作らなくなったとき</li>
<li>何のために: 指示書を取り消す (実績の入った物は取り消せない)</li>
<li>次にすること: 生産管理ボードへ戻る</li>
</ul>
<h3>できること</h3>
<ul>
<li>指示書の詳細の「取消」から開く。</li>
<li>「取消の理由」を書く。書いた理由は、指示書の取消の理由の欄に残る。</li>
<li>「取り消す」で取り消す。「キャンセル」で取り消さずに戻る。</li>
</ul>
</section>
