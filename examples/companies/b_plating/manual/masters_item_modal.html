<section>
<h2>部品の小窓</h2>
<p>部品の要点と取引先を見るだけの小窓です。受注や指示書の画面で部品の名前を押すと開き、詳細へ移れます。</p>
<ul>
<li>使う人: 全員</li>
<li>いつ: 受注や指示書の画面で部品を確かめたいとき</li>
<li>何のために: 画面を移らずに要点と取引先を見る</li>
<li>次にすること: 要れば部品の詳細へ</li>
</ul>
<h3>できること</h3>
<ul>
<li>「自社品番」「品名」「図面番号」「単位」と、この会社の項目の「処理の種類」「膜厚 (μm)」を見る。</li>
<li>取引先ごとの「取引先の品番」と「取引先の品名」を見る。</li>
<li>「詳細を見る」で部品の詳細へ移り、「閉じる」で小窓を閉じる。</li>
</ul>
</section>
