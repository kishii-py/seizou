<section>
<h2>部品の新規登録</h2>
<p>新しい部品を部品マスターに足す画面です。品番は会社の中で 1 つだけです。</p>
<ul>
<li>使う人: 生産管理</li>
<li>いつ: 新しい部品が増えたとき</li>
<li>何のために: 品番・品名・図面を登録する</li>
<li>次にすること: 部品の詳細で標準の工程と取引先を足す</li>
</ul>
<h3>できること</h3>
<ul>
<li>「自社品番」「品名」「図面番号」「単位」「標準単価」「備考」を入れる。</li>
<li>「図面ファイル」で図面のファイルを付ける。</li>
<li>この会社の項目の「処理の種類」「膜厚 (μm)」を入れる。</li>
<li>「保存」で部品を足す。「キャンセル」で保存せずに戻る。</li>
</ul>
</section>
