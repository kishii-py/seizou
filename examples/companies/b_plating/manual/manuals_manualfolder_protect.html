<section>
<h2>フォルダの保護</h2>
<p>フォルダを保護する画面です。保護したフォルダは、移動と削除ができなくなります。</p>
<ul>
<li>使う人: 全員</li>
<li>いつ: 動かされたくないとき</li>
<li>何のために: 移動と削除を止める</li>
<li>次にすること: マニュアルの一覧へ戻る</li>
</ul>
<h3>できること</h3>
<ul>
<li>保護するフォルダの名前を確かめる。</li>
<li>「保護」で保護する。「キャンセル」で保護せずに戻る。</li>
<li>保護したフォルダも、名前と色は変えられる。</li>
</ul>
</section>
