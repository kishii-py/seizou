<section>
<h2>入金を取り消す</h2>
<p>記録した入金を取消にする画面です。取消の記録は履歴に残り、請求書の残の金額に戻ります。</p>
<ul>
<li>使う人: 経理</li>
<li>いつ: 入金を間違えて記録したとき</li>
<li>何のために: 入金を取消にして残を戻す (記録は履歴に残る)</li>
<li>次にすること: 正しい入金を記録し直す</li>
</ul>
<h3>できること</h3>
<ul>
<li>請求書の詳細の「入金」の枠の行から開く。</li>
<li>「保存」で入金を取消にする。取消の記録は履歴に残る。</li>
<li>取り消した後は、請求書の詳細の「入金を記録する」で正しい入金を記録し直す。</li>
</ul>
</section>
