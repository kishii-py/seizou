<section>
<h2>部署の編集</h2>
<p>部署の名前と開ける画面と既定の権限を直す画面です。既にいる人の権限は変わりません。</p>
<ul>
<li>使う人: 総務</li>
<li>いつ: 部署の開ける画面や既定の権限を変えるとき</li>
<li>何のために: 部署の設定を直す (既にいる人の権限は変わらない)</li>
<li>次にすること: 変えた権限を人にも付けるなら、アカウント管理で 1 人ずつ直す</li>
</ul>
<h3>できること</h3>
<ul>
<li>「部署」「開ける画面」「既定の権限」を直す。</li>
<li>「保存」で直す。既にいる人の権限は変わらないので、要ればアカウント管理で 1 人ずつ直す。</li>
<li>「削除」で部署の削除へ移る。「キャンセル」で直さずに戻る。</li>
</ul>
</section>
