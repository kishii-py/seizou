# 在庫の動きの種 (作り物)。完成品の在庫の 製造の完了 (入庫) と 払い出し (出庫) を 1 件ずつ並べる。
# 出荷は在庫の動きに書かない (出荷の記録から集計で在庫数を引く)。B 社に受入の種は無い (協力企業の取引先が無い)。
# このファイルは workorders.yaml が同じフォルダにあるときだけ読む (製造の完了がその指示書を指すため)。
# 製造の完了の部品 (SB-2009・SB-2015・SB-2013) は出荷の種に出てこないので、在庫はマイナスにならない。
# 払い出しは、一部だけ完成した明細の部品 (SB-2013) に置く (在庫 45 が残 100 を下回り、「出荷できる」にならない見本)。
#
# 1 件は次の鍵を持つ。
#
#   製造の完了のとき (その受注の明細の指示書を入庫にする)
#   - 種類: 製造の完了
#     得意先の取引先コード: partners.csv の取引先コード
#     得意先の注文番号: orders.yaml の得意先の注文番号
#     行番号: その受注の明細の行 (workorders.yaml にその明細の指示書がある)
#     数量: 入庫にする数
#     日付: 入庫の日
#     備考: 任意
#
#   払い出しのとき
#   - 種類: 払い出し
#     自社品番: items.csv の自社品番
#     数量: 払い出す数 (正の数で書く)
#     日付: 払い出しの日
#     備考: 任意
#
# 在庫の動きの並び
在庫の動き:
  - 種類: 製造の完了
    得意先の取引先コード: C001
    得意先の注文番号: WK-PO-2610-005
    行番号: 1
    数量: 500
    日付: 2026-11-02
    備考: ""
  - 種類: 製造の完了
    得意先の取引先コード: C004
    得意先の注文番号: FN-2610-003
    行番号: 1
    数量: 10
    日付: 2026-11-02
    備考: ""
  - 種類: 製造の完了
