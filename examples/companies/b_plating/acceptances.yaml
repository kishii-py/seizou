# 検収の種 (作り物)。A 社から受信した注文の写し (受信した注文 → 受け入れて受注にする) と、その受注の明細への検収 (EDI の 4 段目)。
# 受信した注文は、A 社の種の発注 (a_machining/receipts.yaml の 1 件目。発注番号は A 社の連番の 1 つ目 PO-000001) と同じ中身。
# 受け入れは connect.services.accept が行う (受注の入口は「受信した注文」。相手の品番は partner_items.csv の対応で自社の品目に引く)。
# 注文回答は送らない (種の受け入れは送らない形で入れ、受信した注文の返事の欄に書くだけ)。
# 検収は、A 社の受入 (receipts.yaml の受入) と同じ日と数。相手の発注番号 = 相手の発注番号、相手の行番号 = 行番号。
# この受注の出荷 3 件と納品書 1 枚は shipments.yaml と delivery_notes.yaml の末尾にある (受信した注文の写しは受注の次・出荷の前に読む)。
# 2 回入れても重ならない (受信した注文 = 取引先 × 相手の発注番号の受注が既にあれば飛ばす、検収 = 受注の明細 × 検収日)。
#
# 1 件は次の鍵を持つ。
#
#   - 取引先コード: partners.csv の取引先コード (得意先。A 社 = C001)
#     相手の発注番号: 相手の発注番号 (受注の得意先の注文番号になる)
#     発注日: 相手の発注日 (受注日になる)
#     届いた日時: 相手の注文が届いた日時 (任意。YYYY-MM-DD HH:MM:SS。日本の時刻。書かなければ読み込みの日時)
#     承認した日時: 受け入れて受注にした日時 (任意。YYYY-MM-DD HH:MM:SS。日本の時刻。届いた日時より後。書かなければ読み込みの日時)
#     明細: 明細の並び (1 行以上。行番号は並びの順に 1 から付く)
#       - 相手の品番: 相手の品番 (partner_items.csv の取引先の品番にある物)
#         品名: 相手の品名
#         数量: 注文の数
#         単位: 単位
#         単価: 単価
#         納期: 納期 (任意)
#     検収: 検収の並び (検収は 受注の明細 × 検収日 で見分ける)
#       - 行番号: 明細の行
#         検収日: 相手が受け入れた日
#         数量: 相手が受け入れた数
#
# 受信した注文の並び
受信した注文:
  - 取引先コード: C001
    相手の発注番号: PO-000001
    発注日: 2026-10-28
    届いた日時: 2026-10-28 10:15:00
    承認した日時: 2026-10-28 10:40:00
    明細:
      - 相手の品番: WK-1001
        品名: ピストンロッド φ12
        数量: 200
        単位: 個
        単価: 45
        納期: 2026-11-06
      - 相手の品番: WK-1004
        品名: シリンダー取付金具 L 形
        数量: 100
        単位: 個
        単価: 60
        納期: 2026-11-13
    検収:
      - 行番号: 1
        検収日: 2026-10-30
        数量: 200
      - 行番号: 2
        検収日: 2026-11-02
        数量: 40
