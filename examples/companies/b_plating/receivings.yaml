# 入荷の種 (作り物)。得意先から届いたワーク (預かり品) を 1 件ずつ並べる。
# 1 件は 1 つの受注の明細を指し、読み込みがその明細に引き当てる。部品は明細の部品、支給元は受注の得意先。
# 2 件は受注の数と同じ数が届いた明細、1 件は受注の数より少ない数だけ届いた明細 (残りのワークを待っている見本)。
#
# 1 件は次の鍵を持つ。
#
#   - 得意先の取引先コード: partners.csv の取引先コード
#     得意先の注文番号: orders.yaml の得意先の注文番号
#     行番号: その受注の明細の行
#     出所: 無償支給・有償支給・預かり のどれか
#     数量: 届いた数
#     入荷日: 届いた日 (YYYY-MM-DD)
#     ロット: 得意先のロットの番号 (無ければ空)
#     備考: 任意
#
# 入荷の並び
入荷:
  - 得意先の取引先コード: C001
    得意先の注文番号: WK-PO-2610-002
    行番号: 1
    出所: 預かり
    数量: 100
    入荷日: 2026-09-09
    ロット: WL-0909-01
    備考: ""
  - 得意先の取引先コード: C001
