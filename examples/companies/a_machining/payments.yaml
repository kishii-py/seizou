# 入金の種 (作り物)。請求書 (invoices.yaml の請求書。得意先 × 発行日 で見分ける) への入金。
# 1 件目の請求書 (C002・10-29) に一部の入金。2 件目 (C003・11-02) は未入金 (ここに書かない)。
# 2 回入れても重ならない (入金 = 請求書 × 入金日 × 金額)。
#
# 1 件は次の鍵を持つ。
#
#   - 得意先の取引先コード: partners.csv の取引先コード
#     発行日: invoices.yaml の発行日
#     入金: 入金の並び
#       - 入金日: 入金の日
#         金額: 入金の額 (数)
#         入金の方法: 振込 / 現金 / 手形 / その他 (空なら振込)
#         備考: 任意
#
# 請求書の並び
請求書:
  - 得意先の取引先コード: C002
    発行日: 2026-10-29
    入金:
      - 入金日: 2026-11-02
        金額: 100000
        入金の方法: 振込
        備考: 一部入金 (残は月末)
