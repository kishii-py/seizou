# 工程の種 (作り物)。
# 1 件は次の 5 つの鍵を持つ。鍵の名前は部品の表の日本語の項目名。
#
#   - 工程コード: 会社の中で重ならない短い記号
#     名前: 工程の名前
#     協力企業に出すか: true なら協力企業に出す工程、false なら社内の工程
#     並び順: 工程を並べる順の数 (小さいほど前)
#     計画に使う: true なら生産計画の盤に出す工程
#
# 工程の並び
工程:
  - 工程コード: TURN
    名前: 旋削
    協力企業に出すか: false
    並び順: 10
    計画に使う: true
  - 工程コード: MILL
    名前: フライス加工
    協力企業に出すか: false
    並び順: 20
    計画に使う: true
  - 工程コード: GRIND
    名前: 研削
    協力企業に出すか: false
    並び順: 30
    計画に使う: true
  - 工程コード: PLATE
    名前: めっき
    協力企業に出すか: true
    並び順: 40
    計画に使う: false
  - 工程コード: INSP
    名前: 検査
    協力企業に出すか: false
    並び順: 50
    計画に使う: false
