# 工程の種 (作り物)。
# 1 件は次の 4 つの鍵を持つ。鍵の名前は部品の表の日本語の項目名。
#
#   - 工程コード: 会社の中で重ならない短い記号
#     名前: 工程の名前
#     外注か: true なら外注先に出す工程、false なら社内の工程
#     並び順: 工程を並べる順の数 (小さいほど前)
#
# 工程の並び
工程:
  - 工程コード: TURN
    名前: 旋削
    外注か: false
    並び順: 10
  - 工程コード: MILL
    名前: フライス加工
    外注か: false
    並び順: 20
  - 工程コード: GRIND
    名前: 研削
    外注か: false
    並び順: 30
  - 工程コード: PLATE
    名前: めっき
    外注か: true
    並び順: 40
  - 工程コード: INSP
    名前: 検査
    外注か: false
    並び順: 50
