<section>
<h2>フォルダの削除</h2>
<p>フォルダを削除する画面です。中身があるときは「中身も削除する」を選びます。削除したフォルダは元に戻せません。</p>
<ul>
<li>使う人: 全員</li>
<li>いつ: 要らなくなったとき</li>
<li>何のために: フォルダを (中身ごと) 削除する</li>
<li>次にすること: マニュアルの一覧へ戻る</li>
</ul>
<h3>できること</h3>
<ul>
<li>中が空でなければ、「中身も削除する」に印を付ける。中のフォルダとマニュアルと、その版と画像も消える。</li>
<li>「削除」で削除する。元に戻せない。</li>
<li>「キャンセル」で削除せずに戻る。保護したフォルダは削除できない。</li>
</ul>
</section>
