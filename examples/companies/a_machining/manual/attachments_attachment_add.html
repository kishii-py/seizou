<section>
<h2>添付ファイルを付ける</h2>
<p>記録の詳細の「添付ファイル」の枠から開き、写真・検査成績書・作業手順などのファイルを付ける画面です。</p>
<ul>
<li>使う人: 全員</li>
<li>いつ: 写真や検査成績書を残すとき</li>
<li>何のために: 記録の詳細にファイルを付ける</li>
<li>次にすること: 付けた先の詳細の枠から開く</li>
</ul>
<h3>できること</h3>
<ul>
<li>各詳細の「添付ファイルを付ける」から開く。</li>
<li>「ファイル」を選び、「種類」と「備考」を入れる。写真や PDF や表のファイルを付けられる。</li>
<li>「保存」で付ける。「キャンセル」で付けずに戻る。</li>
</ul>
</section>
