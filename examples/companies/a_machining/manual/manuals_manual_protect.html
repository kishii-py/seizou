<h2>マニュアルの保護</h2>
<p>マニュアルを保護する画面です。保護したマニュアルは、移動と削除ができなくなります。本文の編集と版はそのまま使えます。</p>
<ul>
<li>使う人: 全員</li>
<li>いつ: 動かされたくないとき</li>
<li>何のために: 移動と削除を止める</li>
<li>次にすること: マニュアルの一覧へ戻る</li>
</ul>
<h3>できること</h3>
<ul>
<li>マニュアルを読む画面の「保護」から開く。</li>
<li>「保護」で保護する。「キャンセル」で保護せずに戻る。</li>
<li>保護しても、本文の編集と版はそのまま使える。</li>
</ul>
