<section>
<h2>注文を断る</h2>
<p>受信した注文を断る画面です。断る理由を書いて保存します。断った注文は受注になりません。</p>
<ul>
<li>使う人: 営業</li>
<li>いつ: 受信した注文を受けないと決めたとき</li>
<li>何のために: 理由を書いて断る (相手に返す)</li>
<li>次にすること: 受信した注文の一覧へ戻る</li>
</ul>
<h3>できること</h3>
<ul>
<li>受信した注文の行の操作か、受信した注文の詳細の「断る」から開く。</li>
<li>「断った理由」を書く。</li>
<li>「断る」で断る。断った結果は、注文回答として相手へ返る。</li>
<li>「キャンセル」で断らずに戻る。</li>
</ul>
<h3>注意</h3>
<ul>
<li>R10 受信箱の注文は、人が受け入れるまで受注にならない。</li>
</ul>
</section>
