<section>
<h2>部署</h2>
<p>部署の一覧です。部署ごとの開ける部品・既定の権限・人数を見ます。行を押すと詳細へ移ります。</p>
<ul>
<li>使う人: 総務</li>
<li>いつ: 部署の分け方を見直すとき</li>
<li>何のために: 部署ごとの開ける部品と既定の権限と人数を見る</li>
<li>次にすること: 行を押して詳細を見るか、「新規登録」で部署を足す</li>
</ul>
<h3>できること</h3>
<ul>
<li>「部署」「開ける部品」「既定の権限」「人数」「並び順」を見る。</li>
<li>「新規登録」で部署を足す。</li>
<li>行を押すと部署の詳細へ移る。「アカウント管理」でアカウントの一覧へ戻る。</li>
</ul>
</section>
