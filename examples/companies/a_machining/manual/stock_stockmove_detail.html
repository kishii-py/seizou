<section>
<h2>在庫の動きの詳細</h2>
<p>在庫の動き 1 件の部品・種類・数量・日付・備考と、入れた人と日時を見る画面です。入庫は正、出庫は負の数です。</p>
<ul>
<li>使う人: 生産管理</li>
<li>いつ: 1 件の動きを確かめるとき</li>
<li>何のために: 部品・種類・数量・日付と入れた人を見る</li>
<li>次にすること: 在庫の動きへ戻る</li>
</ul>
<h3>できること</h3>
<ul>
<li>在庫の動きの行から開く。</li>
<li>「添付ファイルを付ける」で棚卸しの写真などを付ける。</li>
<li>「一覧に戻る」で在庫の動きへ戻る。</li>
</ul>
<h3 id="basic">基本情報</h3>
<p>「部品」「種類」「数量」「日付」「備考」「入れた人」「入れた日時」を出します。数量は入庫が正、出庫が負の数です。</p>
</section>
