<section>
<h2>取引先の CSV 取り込み</h2>
<p>CSV のファイルから取引先をまとめて登録し、同じ取引先コードの行は更新する画面です。</p>
<ul>
<li>使う人: 営業・総務</li>
<li>いつ: 立ち上げのときと、取引先をまとめて足すとき</li>
<li>何のために: CSV から取引先をまとめて登録・更新する</li>
<li>次にすること: 取引先の一覧で確かめる</li>
</ul>
<h3>できること</h3>
<ul>
<li>「見本の CSV をダウンロード」で、列の見出しの見本を取る。</li>
<li>「CSV のファイル」と「文字コード」を選ぶ。</li>
<li>「保存」で取り込む。同じ取引先コードの行は更新する。</li>
<li>「一覧に戻る」で取引先へ戻る。</li>
</ul>
</section>
