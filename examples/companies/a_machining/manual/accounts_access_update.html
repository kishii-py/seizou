<section>
<h2>アカウントの編集</h2>
<p>アカウントの部署と権限を付け外しする画面です。パスワードは空のままなら変わりません。</p>
<ul>
<li>使う人: 総務</li>
<li>いつ: 部署や権限が変わったとき</li>
<li>何のために: 部署と権限を付け外しする</li>
<li>次にすること: アカウント管理で確かめる</li>
</ul>
<h3>できること</h3>
<ul>
<li>「部署」と「権限」の印を付け外しする。</li>
<li>「パスワード」は、変えるときだけ入れる。空のままなら変わらない。</li>
<li>使用中の印を外すと使用停止になり、ログイン中の人も次の画面でログインへ戻る。</li>
<li>「保存」で直す。「削除」でアカウントの削除へ移る。</li>
</ul>
</section>
