<section>
<h2>取引先の小窓</h2>
<p>取引先の要点を見るだけの小窓です。受注や出荷の画面で取引先の名前を押すと開き、詳細へ移れます。</p>
<ul>
<li>使う人: 全員</li>
<li>いつ: 受注や出荷の画面で取引先を確かめたいとき</li>
<li>何のために: 画面を移らずに要点を見る</li>
<li>次にすること: 要れば取引先の詳細へ</li>
</ul>
<h3>できること</h3>
<ul>
<li>「取引先コード」「名前」「略称」「取引先の種類」を見る。</li>
<li>「締日」「支払日」と「金額の端数の扱い」「消費税の端数の扱い」を見る。</li>
<li>「詳細を見る」で取引先の詳細へ移り、「閉じる」で小窓を閉じる。</li>
</ul>
</section>
