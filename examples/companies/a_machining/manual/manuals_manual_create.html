<h2>マニュアルの新規登録</h2>
<p>フォルダと題と形式を決めて、マニュアルを作る画面です。本文は作った後の「編集」で書きます。</p>
<ul>
<li>使う人: 全員</li>
<li>いつ: 手順を決めたとき (書くのは各部署の担当)</li>
<li>何のために: フォルダと題と形式を決めて作る</li>
<li>次にすること: 「編集」で本文を書く</li>
</ul>
<h3>できること</h3>
<ul>
<li>「フォルダ」を選び、「題」を入れる。</li>
<li>「形式」を選ぶ。ステップ形式は番号付きの手順、ページ形式は長い文書向けで、後から切り替えられる。</li>
<li>「保存」で作る。「キャンセル」で作らずに戻る。</li>
</ul>
</section>
