<section>
<h2>差分</h2>
<p>その版 (左) と今の中身 (右) を、Markdown の字の行のまま並べる画面です。何を直したかを確かめます。</p>
<ul>
<li>使う人: 全員</li>
<li>いつ: 何を直したかを確かめるとき</li>
<li>何のために: 版と今の中身を並べて見る</li>
<li>次にすること: 要れば「この版に戻す」</li>
</ul>
<h3>できること</h3>
<ul>
<li>左の版と右の「今の中身」を、行ごとに並べて見る。</li>
<li>足した行と消した行と変えた行に、印が付く。</li>
<li>足した・消した・変えた行の数を見て、「最初の違う所へ」で変わった行まで進む。</li>
<li>右上の戻すボタン (版の番号が付く) で、この版の中身に戻す。「版の履歴」で一覧へ戻る。</li>
</ul>
</section>
