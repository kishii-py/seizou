<section>
<h2>工程の新規登録</h2>
<p>新しい工程を足す画面です。工程コードは会社の中で 1 つだけです。</p>
<ul>
<li>使う人: 生産管理</li>
<li>いつ: 工程が増えたとき</li>
<li>何のために: 工程コードと名前を登録する</li>
<li>次にすること: 「計画に使う」なら生産計画の盤に出る</li>
</ul>
<h3>できること</h3>
<ul>
<li>「工程コード」「名前」「並び順」を入れる。</li>
<li>協力企業に出す工程なら、「協力企業に出すか」に印を付ける。</li>
<li>生産計画の盤に出すなら、「計画に使う」に印を付ける。</li>
<li>「保存」で工程を足す。「キャンセル」で保存せずに戻る。</li>
</ul>
</section>
