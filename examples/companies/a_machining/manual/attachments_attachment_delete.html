<section>
<h2>添付ファイルの削除</h2>
<p>添付ファイルを削除し、付けた先の記録の詳細に戻る画面です。削除したファイルは元に戻せません。</p>
<ul>
<li>使う人: 全員</li>
<li>いつ: 付け間違えたとき</li>
<li>何のために: 添付ファイルを削除する</li>
<li>次にすること: 付けた先の詳細へ戻る</li>
</ul>
<h3>できること</h3>
<ul>
<li>付けた先の詳細の「添付ファイル」の枠から開く。</li>
<li>削除するファイルの名前と、付けた先を確かめる。</li>
<li>「削除」で削除する。削除したファイルは元に戻せない。</li>
</ul>
</section>
