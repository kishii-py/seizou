<section>
<h2>部署の新規登録</h2>
<p>部署の名前と、開ける部品と、部署を付けたときに入る既定の権限を決める画面です。</p>
<ul>
<li>使う人: 総務</li>
<li>いつ: 新しい部署ができたとき</li>
<li>何のために: 部署の名前と開ける部品と既定の権限を決める</li>
<li>次にすること: アカウント管理で、その部署を人に付ける</li>
</ul>
<h3>できること</h3>
<ul>
<li>「部署」に名前を入れる。</li>
<li>「開ける部品」に印を付ける。印を付けた部品の画面が、この部署の人の左のメニューに出る。</li>
<li>「既定の権限」に印を付ける。アカウントにこの部署を付けたときに、自動で入る権限になる。</li>
<li>「保存」で部署を足す。「キャンセル」で保存せずに戻る。</li>
</ul>
</section>
