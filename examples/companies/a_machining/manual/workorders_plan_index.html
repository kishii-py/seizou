<section>
<h2>生産計画</h2>
<p>工程ごとの日の計画を置く盤です。左のメニューの「生産計画」から開く入口で、工程を選んで開く盤も同じ名前の同じ盤です。</p>
<ul>
<li>使う人: 生産管理</li>
<li>いつ: 週の始めと、指示書を発行した後</li>
<li>何のために: 工程ごとに日の計画を置く</li>
<li>次にすること: 製造が盤を見て順に作る</li>
</ul>
<h3>できること</h3>
<ul>
<li>「前」「今日」「次」で日を移り、「週」と「6 週」で見る幅を切り替える。</li>
<li>右の「未計画」の指示書を、盤の日へドラッグで置く。</li>
<li>置いた棒は「未計画に戻す」で外す。</li>
<li>棒を押すと、指示書の要点を小窓で開く。</li>
</ul>
</section>
