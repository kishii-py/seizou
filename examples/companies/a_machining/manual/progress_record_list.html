<section>
<h2>実績の一覧</h2>
<p>指示書の工程ごとに入れた実績の記録を見る画面です。日時の新しい順に並びます。</p>
<ul>
<li>使う人: 製造・生産管理</li>
<li>いつ: 入れた実績を確かめるとき</li>
<li>何のために: 工程ごとの実績の記録を見る</li>
<li>次にすること: 指示書の詳細へ</li>
</ul>
<h3>できること</h3>
<ul>
<li>「キーワード」で記録を探し、「絞り込み」を押す。</li>
<li>「新規登録」で実績を入れる。</li>
<li>行の ⋮ か右クリックから「編集」「削除」へ進む。直す画面と消す確かめは小窓で開く。</li>
<li>「CSV」で書き出す。</li>
</ul>
</section>
