<section>
<h2>不良の原因と対策</h2>
<p>不良の行に原因と対策を書く画面です。区分と数は実績の編集で直します。</p>
<ul>
<li>使う人: 品質</li>
<li>いつ: 不良の原因を調べた後</li>
<li>何のために: 原因と対策を不良の行に残す</li>
<li>次にすること: 不良の一覧で確かめる</li>
</ul>
<h3>できること</h3>
<ul>
<li>不良の一覧の行の ⋮ か右クリックの「原因と対策を書く」から開く。</li>
<li>「原因」と「対策」を書く。どの実績の不良かは、ボタンの字に指示書の工程と区分と数で出る。</li>
<li>「原因と対策を保存する」で書いて不良の一覧へ戻る。書いた事は、指示書の詳細の「履歴」に残る。</li>
</ul>
</section>
