# 受入の種 (作り物)。協力企業への発注と、その受入を一緒に並べる (A 社だけ。B 社に協力企業の取引先は無い)。
# 発注は相手に送らずに入れる (S001 には向き「送る」のつながりの種があるが、種の読み込みでは送らない)。
# 受入の金額は 受け入れた数 × 明細の単価 (取引先の小計の計算方法で丸める)。受入は在庫の入庫も作る。
# 明細の部品 (WK-1001・WK-1004) は受注の種に 1 つも無い。2 行目は一部だけ受け入れるので、発注は「作成」のまま。
# 発注は 取引先コード × 備考 で見分ける (発注番号は会社の連番なので種に書けない)。備考に固有の字を書く。
#
# 1 件は次の鍵を持つ。
#
#   - 取引先コード: partners.csv の協力企業の取引先コード
#     発注日: 発注の日
#     備考: その発注に固有の字
#     明細: 明細の並び (1 行以上。行番号は並びの順に 1 から付く)
#       - 自社品番: items.csv の自社品番
#         数量: 発注の数
#         単価: 発注の単価
#         納期: 納期 (任意)
#     受入: 受入の並び (受入は 発注の明細 × 受入日 で見分ける)
#       - 行番号: 明細の行
#         受入日: 受け入れた日
#         数量: 受け入れた数
#         備考: 任意
#
# 発注の並び
発注:
  - 取引先コード: S001
    発注日: 2026-10-28
    備考: 表面処理の依頼 (見本の発注)
    明細:
      - 自社品番: WK-1001
        数量: 200
        単価: 45
        納期: 2026-11-06
      - 自社品番: WK-1004
        数量: 100
        単価: 60
        納期: 2026-11-13
    受入:
      - 行番号: 1
        受入日: 2026-10-30
        数量: 200
        備考: ""
      - 行番号: 2
        受入日: 2026-11-02
        数量: 40
        備考: 残りは後日
