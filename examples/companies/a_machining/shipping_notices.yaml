# 出荷の知らせの種 (作り物)。協力企業 (B 社) の seizou から届いた出荷の知らせ (EDI の 3 段目) を、発注の明細に入れる。
# 発注は receipts.yaml の発注 (取引先コード × 備考 で見分ける)。相手の出荷番号と相手の受注番号は、B 社の種を新しい置き場に
# 入れたときの番号の見込み (記録と画面のための字。合わなくても止めない)。
# 1〜2 件目は受入 (receipts.yaml の受入) の前の日の知らせ。3 件目は行 2 の残り 60 の知らせで、受入はまだ
# (発注の詳細の「受入を記録する」の見本)。
# 注文回答: 受け入れた を書いた発注は「作成」から「送った」→「相手が受け入れた」に進める (注文回答の写し。相手に送らず、
# 送った注文の行も作らない)。
# 2 回入れても重ならない (出荷の知らせ = 発注の明細 × 相手の出荷番号)。相手に HTTP を送らない。
#
# 1 件は次の鍵を持つ。
#
#   - 取引先コード: partners.csv の協力企業の取引先コード
#     備考: receipts.yaml の発注の備考 (発注を見分ける字)
#     注文回答: 受け入れた (任意。書けば発注の状態を「相手が受け入れた」に進める。ほかの字は使えない)
#     出荷の知らせ: 出荷の知らせの並び
#       - 行番号: 発注の明細の行
#         出荷日: 相手が出荷した日
#         数量: 相手が出荷した数
#         相手の出荷番号: 相手の出荷番号 (発注の明細の中で重ならない字)
#         相手の受注番号: 相手の受注番号 (任意)
#
# 発注の並び
発注:
  - 取引先コード: S001
    備考: 表面処理の依頼 (見本の発注)
    注文回答: 受け入れた
    出荷の知らせ:
      - 行番号: 1
        出荷日: 2026-10-29
        数量: 200
        相手の出荷番号: SH-000022
        相手の受注番号: SO-000021
      - 行番号: 2
        出荷日: 2026-11-01
        数量: 40
        相手の出荷番号: SH-000023
        相手の受注番号: SO-000021
      - 行番号: 2
        出荷日: 2026-11-03
        数量: 60
        相手の出荷番号: SH-000024
        相手の受注番号: SO-000021
