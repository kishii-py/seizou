# 入荷の種 (作り物)。得意先から届いた支給材を 1 件ずつ並べる (無償支給 1 件と有償支給 1 件)。
# 1 件は 1 つの受注の明細を指し、読み込みがその明細に引き当てる。部品は明細の部品、支給元は受注の得意先。
#
# 1 件は次の鍵を持つ。
#
#   - 得意先の取引先コード: partners.csv の取引先コード
#     得意先の注文番号: orders.yaml の得意先の注文番号
#     行番号: その受注の明細の行
#     出所: 無償支給・有償支給・預かり のどれか
#     数量: 届いた数
#     入荷日: 届いた日 (YYYY-MM-DD)
#     ロット: 得意先のロットの番号 (無ければ空)
#     備考: 任意
#
# 入荷の並び
入荷:
  - 得意先の取引先コード: C002
    得意先の注文番号: CF-2610-002
    行番号: 1
    出所: 無償支給
    数量: 200
    入荷日: 2026-09-10
    ロット: ""
    備考: 素材の丸棒の支給
  - 得意先の取引先コード: C004
    得意先の注文番号: MY-2610-001
    行番号: 2
    出所: 有償支給
    数量: 50
    入荷日: 2026-10-13
    ロット: MS-1013
    備考: 鍛造の素形材の支給
