# 在庫の動きの種 (作り物)。完成品の在庫の 製造の完了 (入庫) と 払い出し (出庫) を 1 件ずつ並べる。
# 出荷は在庫の動きに書かない (出荷の記録から集計で在庫数を引く)。受入の入庫は receipts.yaml の受入が作る。
# このファイルは workorders.yaml が同じフォルダにあるときだけ読む (製造の完了がその指示書を指すため)。
# 製造の完了の部品 (WK-1030・WK-1029・WK-1014) は出荷の種に出てこないので、在庫はマイナスにならない。
# 払い出しは、一部だけ完成した明細の部品に置く (全部が完成した部品に置くと在庫が残を下回り、
# 注残の盤の「出荷できる」の見本が無くなるため)。
#
# 1 件は次の鍵を持つ。
#
#   製造の完了のとき (その受注の明細の指示書を入庫にする)
#   - 種類: 製造の完了
#     得意先の取引先コード: partners.csv の取引先コード
#     得意先の注文番号: orders.yaml の得意先の注文番号
#     行番号: その受注の明細の行 (workorders.yaml にその明細の指示書がある)
#     数量: 入庫にする数
#     日付: 入庫の日
#     備考: 任意
#
#   払い出しのとき
#   - 種類: 払い出し
#     自社品番: items.csv の自社品番
#     数量: 払い出す数 (正の数で書く)
#     日付: 払い出しの日
#     備考: 任意
#
# 在庫の動きの並び
在庫の動き:
  - 種類: 製造の完了
    得意先の取引先コード: C002
    得意先の注文番号: CF-2610-007
    行番号: 1
    数量: 300
    日付: 2026-11-02
    備考: ""
  - 種類: 製造の完了
    得意先の取引先コード: C003
    得意先の注文番号: SL-2610-004
    行番号: 1
    数量: 200
    日付: 2026-11-03
    備考: 500 のうち 200 が先に完成
  - 種類: 製造の完了
    得意先の取引先コード: C004
    得意先の注文番号: MY-2610-003
    行番号: 1
    数量: 500
    日付: 2026-11-03
    備考: ""
  - 種類: 払い出し
    自社品番: WK-1029
    数量: 10
    日付: 2026-11-03
    備考: 検査用に払い出し
