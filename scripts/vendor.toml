# 1 項目 = 名前・版・取る URL (版を含む)・license・sha256。
# tool を持つ項目は CSS を作る道具で、scripts/build_css.py が道具の置き場 (.tools/tailwind/) に取る。
# path を持つ項目は配布物の static に同梱する物で、scripts/fetch_vendor.py が取って置く。
# 版を上げるときは、版と URL と sha256 を一緒に書き換え、試験を回す。

