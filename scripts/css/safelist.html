<!-- 共通の見た目 10 個の class 名を並べただけの HTML。部品のテンプレートが無いときも、配布物の CSS にこれらを入れるため。画面には出さない。 -->
<!-- ボタン --><button class="btn"></button>
<!-- 表 --><table class="table"></table>
<!-- 入力 --><input class="input"><select class="select"></select><textarea class="textarea"></textarea>
<!-- 印 --><span class="badge"></span>
<!-- 知らせ --><div class="alert"></div>
<!-- 小窓 --><dialog class="modal"><div class="modal-box"></div></dialog>
<!-- カード --><div class="card"><div class="card-body"></div></div>
<!-- 見出しの帯 --><div class="navbar"></div>
<!-- 左のメニュー --><ul class="menu"></ul>
<!-- ページ送り --><div class="join"><button class="join-item btn"></button></div>
