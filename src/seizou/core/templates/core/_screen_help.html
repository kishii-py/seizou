{% load seizou_icons %}
{# 画面と枠の「?」。押すと、その画面 (part があれば枠) の使い方の断片を小窓に出す。href は JS の無いときと中クリックの飛び先 (使い方のページのその画面の所)。include する側は part と label を必ず渡す。 #}
{% if screen_anchor %}<a class="btn btn-ghost btn-square btn-sm text-base-content/50 hover:text-base-content" href="{% url 'core:manual' %}#{{ screen_anchor }}" hx-get="{% url 'core:manual_fragment' screen_anchor %}{% if part %}?part={{ part }}{% endif %}" hx-target="#seizou-modal-box" hx-swap="innerHTML" hx-on::after-request="document.getElementById('seizou-modal').showModal()" onclick="event.preventDefault()" title="{{ label }}" aria-label="{{ label }}">{% icon "help" "size-4" %}</a>{% endif %}
