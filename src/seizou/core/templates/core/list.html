{% extends "core/base.html" %}
{% block content %}
<form method="get" class="flex flex-wrap items-end gap-2 mb-3" hx-get="{{ request.path }}" hx-target="#rows" hx-push-url="true" hx-trigger="submit, keyup changed delay:300ms from:input[name='q']">
  <label class="form-control"><span class="label-text">検索</span><input class="input input-bordered input-sm" type="search" name="q" value="{{ search_q }}" placeholder="{{ search_hint }}"></label>
  <label class="form-control"><span class="label-text">1 ページ</span>
    <select class="select select-bordered select-sm" name="per" hx-trigger="change">{% for n in page_sizes %}<option value="{{ n }}" {% if n == per %}selected{% endif %}>{{ n }} 件</option>{% endfor %}</select>
  </label>
  <input type="hidden" name="sort" value="{{ sort }}">
  <button class="btn btn-sm" type="submit">絞る</button>
  <a class="btn btn-sm btn-ghost" href="?{{ query_without_page }}&format=csv">CSV</a>
  {% if create_url %}<a class="btn btn-sm btn-primary ml-auto" href="{{ create_url }}">新しく入れる</a>{% endif %}
</form>
<div id="rows">{% include "core/_rows.html" %}</div>
{% endblock %}
