{# 小窓の中身。見るだけと、詳細への移動のボタン。小窓の枠 (dialog) は base.html の 1 か所。 #}
<h3 class="font-bold text-lg mb-2">{{ object }}</h3>
<dl class="grid grid-cols-[max-content_1fr] gap-x-4 gap-y-1 text-sm">
  {% for field in fields %}<dt class="opacity-70">{{ field.label }}</dt><dd>{{ field.value|default_if_none:"" }}</dd>{% endfor %}
</dl>
<div class="modal-action">
  {% if detail_url %}<a class="btn btn-sm btn-primary" href="{{ detail_url }}">詳細を開く</a>{% endif %}
  <form method="dialog"><button class="btn btn-sm" autofocus>閉じる</button></form>
</div>
