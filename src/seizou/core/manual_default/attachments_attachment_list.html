<section>
<h2>添付ファイル</h2>
<p>受注や部品などの詳細の「添付ファイル」の枠から付けたファイルを、全部まとめて探す一覧です。行を押すと、付けた先の詳細を開きます。</p>
<ul>
<li>使う人: 全員</li>
<li>いつ: どこに何を付けたかを探すとき</li>
<li>何のために: 付けたファイルを全部まとめて探す</li>
<li>次にすること: 行から付けた先の詳細へ</li>
</ul>
<h3>できること</h3>
<ul>
<li>「キーワード」で探し、「絞り込み」を押す。</li>
<li>行を押すと、付けた先の記録の詳細へ移る。</li>
<li>「CSV」で書き出す。ファイルを付けるのは、各詳細の「添付ファイルを付ける」から。</li>
</ul>
</section>
