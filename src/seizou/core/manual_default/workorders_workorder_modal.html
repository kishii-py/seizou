<section>
<h2>指示書の小窓</h2>
<p>指示書の要点と工程の並びを見るだけの小窓です。生産計画の盤の棒などから開き、詳細へ移れます。</p>
<ul>
<li>使う人: 製造・生産管理</li>
<li>いつ: 生産計画の盤や生産管理ボードで指示書を確かめたいとき</li>
<li>何のために: 画面を移らずに要点と工程の並びを見る</li>
<li>次にすること: 要れば指示書の詳細へ</li>
</ul>
<h3>できること</h3>
<ul>
<li>「指示書番号」「受注の明細」「数量」「発行日」「状態」「着手日時」を見る。</li>
<li>「工程の並び」で、工程ごとの順と開始と終了の日を見る。</li>
<li>「詳細を見る」で指示書の詳細へ移り、「閉じる」で小窓を閉じる。</li>
</ul>
</section>
