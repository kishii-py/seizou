<section>
<h2>フィードバックの編集</h2>
<p>下書きの種類・画面・題・困りごと・場面・望む形・影響する画面を直す画面です。直せるのは、書いた人 (下書きの間) とアカウント管理の担当者です。</p>
<ul>
<li>使う人: 全員</li>
<li>いつ: AI の下書きを直すとき・書き足すとき</li>
<li>何のために: 下書きの字を直す</li>
<li>次にすること: 保存して詳細で確かめる</li>
</ul>
<h3>できること</h3>
<ul>
<li>「種類」「画面」「題」「困りごと」「場面」「望む形」「影響する画面」を直す。</li>
<li>「保存」で直す。「キャンセル」で直さずに戻る。</li>
<li>編集の画面を開けるのは、その下書きが一覧に出る人だけ。</li>
</ul>
</section>
