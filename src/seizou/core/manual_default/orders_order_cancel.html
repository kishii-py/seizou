<section>
<h2>受注を取り消す</h2>
<p>受注を取消にする画面です。取消の後は、出荷も指示書も作れません。</p>
<ul>
<li>使う人: 営業</li>
<li>いつ: 注文が無くなったとき</li>
<li>何のために: 受注を取消にする (出荷も指示書も作れなくなる)</li>
<li>次にすること: 受注の一覧へ戻る</li>
</ul>
<h3>できること</h3>
<ul>
<li>受注の詳細の「取消」から開く。</li>
<li>「取消の理由」を書く。書くと、受注の備考の末尾に残る。</li>
<li>「取り消す」で取消にする。「キャンセル」で取り消さずに戻る。</li>
</ul>
<h3>注意</h3>
<ul>
<li>R05 取消した受注には、出荷も指示書も作れない。</li>
</ul>
</section>
