<section>
<h2>部品マスターの CSV 取り込み</h2>
<p>CSV のファイルから部品をまとめて登録し、同じ自社品番の行は更新する画面です。</p>
<ul>
<li>使う人: 生産管理・総務</li>
<li>いつ: 立ち上げのときと、部品をまとめて足すとき</li>
<li>何のために: CSV から部品をまとめて登録・更新する</li>
<li>次にすること: 部品マスターで確かめる</li>
</ul>
<h3>できること</h3>
<ul>
<li>「見本の CSV をダウンロード」で、列の見出しの見本を取る。</li>
<li>「CSV のファイル」と「文字コード」を選ぶ。</li>
<li>「取り込む」で CSV の行を取り込む。同じ自社品番の行は更新する。</li>
<li>「一覧に戻る」で部品マスターへ戻る。</li>
</ul>
</section>
