<section>
<h2>社員の新規登録</h2>
<p>社員番号と名前を登録する画面です。先頭の 0 の数が違う番号は、同じ番号と見ます。</p>
<ul>
<li>使う人: 総務・生産管理</li>
<li>いつ: 人が入ったとき</li>
<li>何のために: 実績に残す作業した人を、社員番号で引けるようにする</li>
<li>次にすること: 実績の入力で社員番号を入れる</li>
</ul>
<h3>できること</h3>
<ul>
<li>「社員番号」「名前」「備考」を入れる。社員番号は札のバーコードと同じ番号にする。</li>
<li>先頭の 0 の数だけが違う番号 (0012 と 12 など) は同じ番号と見るので、もう 1 人には登録できない。</li>
<li>「保存」で社員を足す。「キャンセル」で保存せずに戻る。</li>
</ul>
</section>
