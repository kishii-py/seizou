<section>
<h2>アカウントの削除</h2>
<p>アカウントを削除する画面です。削除したアカウントではログインできなくなります。記録の名前は残り、同じログイン ID は空きます。</p>
<ul>
<li>使う人: 総務</li>
<li>いつ: 人が辞めたとき</li>
<li>何のために: ログインできなくする</li>
<li>次にすること: アカウント管理へ戻る</li>
</ul>
<h3>できること</h3>
<ul>
<li>アカウントの編集の「削除」から開く。</li>
<li>削除するアカウントのログイン ID を確かめ、「削除」を押す。元に戻せない。</li>
<li>「キャンセル」で削除せずに戻る。</li>
</ul>
</section>
