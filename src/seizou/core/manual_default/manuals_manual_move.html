<section>
<h2>マニュアルの移動</h2>
<p>マニュアルを、ほかのフォルダかルートへ移す画面です。</p>
<ul>
<li>使う人: 全員</li>
<li>いつ: 置き場を整理するとき</li>
<li>何のために: マニュアルをほかのフォルダへ移す</li>
<li>次にすること: マニュアルの一覧で確かめる</li>
</ul>
<h3>できること</h3>
<ul>
<li>マニュアルを読む画面の「移動」から開く。</li>
<li>「移動先」でフォルダかルートを選ぶ。</li>
<li>「保存」で移す。「キャンセル」で移さずに戻る。保護したマニュアルは移せない。</li>
</ul>
</section>
