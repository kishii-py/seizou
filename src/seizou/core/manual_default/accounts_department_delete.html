<section>
<h2>部署の削除</h2>
<p>人が付いていない部署を消す画面です。人が付いている部署は、先にアカウント管理でその人の部署を外します。</p>
<ul>
<li>使う人: 総務</li>
<li>いつ: 使わなくなった部署を消すとき</li>
<li>何のために: 人が付いていない部署を一覧から消す</li>
<li>次にすること: 人が付いていれば、先にアカウント管理で部署を外す</li>
</ul>
<h3>できること</h3>
<ul>
<li>部署の編集の「削除」から開く。</li>
<li>付いている人の数を確かめる。人が付いている部署は削除できない。</li>
<li>「削除」で消す。「キャンセル」で消さずに戻る。</li>
</ul>
</section>
