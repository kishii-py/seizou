<section>
<h2>部品の編集</h2>
<p>部品の項目を編集する画面です。図面を差し替えると、前の図面は版として残ります。</p>
<ul>
<li>使う人: 生産管理</li>
<li>いつ: 図面や単価が変わったとき</li>
<li>何のために: 部品の項目を直す</li>
<li>次にすること: 部品の詳細で確かめる</li>
</ul>
<h3>できること</h3>
<ul>
<li>「品名」「図面番号」「単位」「標準単価」「備考」を直す。</li>
<li>「図面ファイル」で図面を差し替える。</li>
<li>会社ごとの項目 (立ち上げのときに業種に合わせて決めた項目)を直す。</li>
<li>「保存」で直す。「キャンセル」で直さずに戻る。</li>
</ul>
</section>
