<section>
<h2>版の履歴</h2>
<p>今の版と、新しい版として保存したときに残った前の中身の一覧です。差分を見て、この版に戻せます。</p>
<ul>
<li>使う人: 全員</li>
<li>いつ: 前の中身を見たいとき</li>
<li>何のために: 残した版の一覧を見る</li>
<li>次にすること: 差分を見るか、この版に戻す</li>
</ul>
<h3>できること</h3>
<ul>
<li>「版」「日時」「保存した人」「メモ (次の版で変えたこと)」を見る。メモは、変える前の版の行に付く。</li>
<li>行の「差分」で、その版と今の中身を並べて見る。</li>
<li>行の「この版に戻す」で、その版の中身に戻す。</li>
</ul>
</section>
