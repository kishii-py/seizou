<section>
<h2>棚卸しの調整</h2>
<p>実地の在庫数を入れると、今の在庫数との差を動きとして残す画面です。在庫を数え始める部品は、この画面で今の数を入れます。</p>
<ul>
<li>使う人: 生産管理</li>
<li>いつ: 棚卸しのときと、在庫を数え始めるとき</li>
<li>何のために: 実地の数との差を動きとして残す</li>
<li>次にすること: 在庫で確かめる</li>
</ul>
<h3>できること</h3>
<ul>
<li>「部品」を選び、「実地の在庫数」と「日付」を入れる。</li>
<li>「備考 (理由)」に、調整の理由を書く。</li>
<li>「保存」で差を動きとして残す。「キャンセル」で保存せずに戻る。</li>
</ul>
</section>
