<section>
<h2>払い出し</h2>
<p>検査や社内の使用などで在庫から出した数を記録する画面です。在庫より多くても止めず、マイナスの在庫として出します。</p>
<ul>
<li>使う人: 生産管理</li>
<li>いつ: 検査や社内の使用で在庫から出したとき</li>
<li>何のために: 出した数を記録する</li>
<li>次にすること: 在庫で確かめる</li>
</ul>
<h3>できること</h3>
<ul>
<li>「部品」を選び、「数量」「日付」「備考」を入れる。</li>
<li>「保存」で記録する。「キャンセル」で保存せずに戻る。</li>
<li>在庫より多い数も記録でき、在庫はマイナスとして出る。</li>
</ul>
</section>
