<section>
<h2>図面ビューア</h2>
<p>部品の図面を拡大・回転して見る画面です。差し替えた前の図面は版として残り、見比べられます。</p>
<ul>
<li>使う人: 全員</li>
<li>いつ: 図面を確かめるときと、前の版と見比べるとき</li>
<li>何のために: 図面を拡大・回転して見る</li>
<li>次にすること: 要れば「図面を版に戻す」へ</li>
</ul>
<h3>できること</h3>
<ul>
<li>「拡大」「縮小」「原寸」「回転」で図面を見る。</li>
<li>「ダウンロード」で図面のファイルを取る。</li>
<li>前の版があれば見比べ、「図面を版に戻す」で前の版を今の図面に戻す。</li>
<li>「詳細に戻る」で部品の詳細へ戻る。</li>
</ul>
</section>
