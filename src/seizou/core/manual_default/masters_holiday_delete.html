<section>
<h2>休日の削除</h2>
<p>休日を 1 日消す画面です。消した日は稼働日として数えます。消すと休日の一覧へ戻ります。</p>
<ul>
<li>使う人: 生産管理・総務</li>
<li>いつ: 間違えて足した休日を消すとき</li>
<li>何のために: 休日を消し、その日を稼働日として数える</li>
<li>次にすること: 休日の一覧で確かめる</li>
</ul>
<h3>できること</h3>
<ul>
<li>休日の詳細の「削除」から開く。</li>
<li>消す休日の日付と名前を確かめる。</li>
<li>「削除」で消して休日の一覧へ戻る。「キャンセル」で消さずに詳細へ戻る。</li>
</ul>
</section>
