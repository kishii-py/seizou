<section>
<h2>取引先の編集</h2>
<p>取引先の項目を編集する画面です。締日・支払日・端数の扱いが変わったときに直します。</p>
<ul>
<li>使う人: 営業・経理</li>
<li>いつ: 締日・支払日・端数の扱いを直すとき</li>
<li>何のために: 取引先の項目を直す</li>
<li>次にすること: 取引先の詳細で確かめる</li>
</ul>
<h3>できること</h3>
<ul>
<li>「名前」「略称」「取引先の種類」を直す。</li>
<li>「締日」「支払の月」「支払日」と「金額の端数の扱い」「消費税の端数の扱い」「消費税の端数の向き」を直す。</li>
<li>「保存」で直す。「キャンセル」で直さずに戻る。</li>
</ul>
</section>
