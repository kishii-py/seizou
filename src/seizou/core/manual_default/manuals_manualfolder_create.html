<section>
<h2>新しいフォルダ</h2>
<p>今のフォルダの中に、新しいフォルダを作る画面です。色はフォルダの印になります。</p>
<ul>
<li>使う人: 全員</li>
<li>いつ: マニュアルの置き場を分けるとき</li>
<li>何のために: フォルダを作る</li>
<li>次にすること: マニュアルを置く</li>
</ul>
<h3>できること</h3>
<ul>
<li>マニュアルの一覧の「新しいフォルダ」から開く。</li>
<li>「名前」と「色」を決める。</li>
<li>「保存」で作る。「キャンセル」で作らずに戻る。</li>
</ul>
</section>
