<section>
<h2>納品書</h2>
<p>納品書の一覧です。発行日の新しい順に並びます。行を押すと、印刷用の画面と PDF の入口がある詳細へ移ります。</p>
<ul>
<li>使う人: 出荷</li>
<li>いつ: 出荷と同時</li>
<li>何のために: 得意先に渡す納品書を持つ</li>
<li>次にすること: 行から詳細へ (印刷用の画面と PDF)。請求は経理</li>
</ul>
<h3>できること</h3>
<ul>
<li>「納品書番号」「得意先」「発行日」「状態」を見る。状態は「発行」か「取消」。</li>
<li>「キーワード」で番号や得意先を探す。</li>
<li>「新規登録」で、出荷をまとめて納品書を作る。</li>
<li>行を押すと納品書の詳細へ移る。「CSV」で書き出す。</li>
</ul>
</section>
