<section>
<h2>取引先</h2>
<p>得意先と協力企業の一覧です。締日・支払日と端数の扱いを取引先ごとに持ちます。</p>
<ul>
<li>使う人: 営業・経理</li>
<li>いつ: 取引先が増えたときと、締日と支払の条件を直すとき</li>
<li>何のために: 得意先と協力企業を持つ</li>
<li>次にすること: 行から詳細へ。受注と発注で選ぶ</li>
</ul>
<h3>できること</h3>
<ul>
<li>「取引先コード」「名前」「略称」「取引先の種類」「締日」「支払日」を見る。</li>
<li>「キーワード」でコードや名前を探す。</li>
<li>「新規登録」で取引先を足し、「CSV 取り込み」でまとめて登録する。</li>
<li>行を押すと取引先の詳細へ移る。「CSV」で書き出す。</li>
</ul>
</section>
