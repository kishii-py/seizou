<section>
<h2>進捗</h2>
<p>指示書の工程ごとの予定の数・実績の合計・残を見る画面です。10 秒ごとに、実績が入った行を差し替えます。</p>
<ul>
<li>使う人: 製造・生産管理</li>
<li>いつ: 工程が終わるたびと、進み具合を見るとき</li>
<li>何のために: 指示書の工程ごとの予定・実績・残を見る</li>
<li>次にすること: 行から実績の新規登録へ</li>
</ul>
<h3>できること</h3>
<ul>
<li>「指示書番号」「部品」「工程」「予定の数」「実績の合計」「残」を見る。残は予定の数から実績の合計を引いた数。</li>
<li>「新規登録」で実績を入れる。</li>
<li>「実績の一覧」で、入れた実績の記録を見る。</li>
</ul>
</section>
