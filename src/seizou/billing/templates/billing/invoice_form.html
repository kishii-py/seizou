{% extends "core/form.html" %}
{# 請求書を作る: core の入力の画面に、得意先の欄で出荷の行を絞る小さな JS を足す。 #}
{# 行は checkbox の data-partner (出荷の受注の得意先) で見分け、合わない行の枠を hidden にする (class は付け替えない)。 #}
{# JS が動かなくても、得意先と違う出荷は services が R09 で断る。 #}
{% block content %}{{ block.super }}
<script>
(function () {
  var customer = document.getElementById("id_customer");
  var box = document.getElementById("id_shipments");
  if (!customer || !box) return;
  function narrow() {
    var chosen = customer.value;
    box.querySelectorAll("input[data-partner]").forEach(function (input) {
      var row = input.closest("div");
      if (row) row.hidden = chosen !== "" && input.dataset.partner !== chosen;
    });
  }
  customer.addEventListener("change", narrow);
  narrow();  // 得意先が最初から入っているとき (納品書の詳細からの ?customer=) も、その得意先の出荷だけにする
})();
</script>
{% endblock %}
