[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "seizou"
version = "0.2.0.dev0"
description = "町工場や中小の製造業が、1 つの命令で自社専用のシステムを持つための Django の部品"
readme = "README.md"
authors = [{ name = "Atsuro Kishii" }]
requires-python = ">=3.12"
license = "Apache-2.0 AND MIT AND 0BSD AND OFL-1.1 AND BSD-3-Clause"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Manufacturing",
    "Natural Language :: Japanese",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "Django>=5.2.19,<6.2",
    "Pillow>=13.0.0",
    "requests>=2.33.0",
    "PyYAML>=6.0.3",
    "anthropic>=2.3.0",
    "qrcode>=8.2",
    "mcp>=2.3.0",
    "markdown>=3.11.2",
    "nh3>=0.2.20",
]

[project.scripts]
seizou = "seizou.cli:main"

[project.urls]
Homepage = "https://github.com/kishii-py/seizou"
Repository = "https://github.com/kishii-py/seizou"
Changelog = "https://github.com/kishii-py/seizou/blob/main/CHANGELOG.md"
Issues = "https://github.com/kishii-py/seizou/issues"

[project.optional-dependencies]
pdf = [
    "weasyprint>=70.0",
]
server = [
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "ruff",
    "playwright",
    "psycopg[binary]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/seizou"]

[tool.hatch.build.targets.sdist]
# 配布の sdist に入れない物 (夜の記録・E2E の絵・試験・開発の道具)。src と examples と plugin と README・LICENSE・NOTICE は入る
exclude = ["/docs", "/tests", "/scripts", "/.github", "/.githooks", "/.gitleaksignore", "/uv.lock", "/.python-version", "/AGENTS.md", "/CLAUDE.md", "/RULES.md", "/GOVERNANCE.md", "/CONTRIBUTING.md"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "pdf: WeasyPrint が要る試験 (Windows の CI では除く)",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["tests/fixtures/"]

[tool.ruff.lint]
# 規則は標準の 4 群に固定する (版が上がって既定が広がっても、レーンと CI の結果が変わらないように)。
select = ["E4", "E7", "E9", "F"]
