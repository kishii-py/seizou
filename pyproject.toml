[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "seizou"
version = "0.1.0"
description = "町工場や中小の製造業が、1 つの命令で自社専用のシステムを持つための Django の部品"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0 AND MIT AND 0BSD AND OFL-1.1 AND BSD-3-Clause"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "Django>=5.2.18,<6.2",
    "Pillow>=13.0.0",
    "requests",
    "PyYAML",
    "anthropic>=2.3.0",
    "qrcode>=8.2",
    "mcp>=2.3.0",
    "markdown>=3.11.2",
    "nh3>=0.2.20",
]

[project.scripts]
seizou = "seizou.cli:main"

[project.optional-dependencies]
pdf = [
    "weasyprint>=70.0",
]
server = [
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "ruff",
    "playwright",
    "psycopg[binary]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/seizou"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "pdf: WeasyPrint が要る試験 (Windows の CI では除く)",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["tests/fixtures/"]

[tool.ruff.lint]
# 規則は標準の 4 群に固定する (版が上がって既定が広がっても、レーンと CI の結果が変わらないように)。
select = ["E4", "E7", "E9", "F"]
