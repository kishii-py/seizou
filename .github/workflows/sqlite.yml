name: sqlite

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: tests.settings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.21"
      - name: WeasyPrint の OS の部品を入れる
        run: |
          # 実行の場の apt の取り先が、まれに名前を引けずに落ちる (2026-11-11 に 2 回続いた)。3 回まで試す
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libharfbuzz-subset0 && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            # 実行の場の既定の取り先 (鏡の一覧 /etc/apt/apt-mirrors.txt) の名前が引けない時は、Ubuntu の本家の取り先に替えて試す
            sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
            sleep 15
          done
      - name: 依存を入れる
        run: uv sync --locked --group dev --extra pdf
      - name: ruff
        run: uv run ruff check .
      - name: pytest
        run: uv run pytest
      - name: migration の差分が無いことを確かめる
        run: uv run python -m django makemigrations --check --dry-run
      - name: 空の DB に migrate する
        run: uv run python -m django migrate
      - name: 決まりの検査 (書き方の決まり) を部品のコードに回す
        run: uv run python -m django seizou_check src/seizou
      - name: CSS を作り直し、commit した物と比べる
        run: uv run python scripts/build_css.py --check
