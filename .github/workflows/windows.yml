name: windows

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      DJANGO_SETTINGS_MODULE: tests.settings
      # 日本語の出力を cp1252 の標準出力で落とさない (hook のスクリプトとテスト)
      PYTHONUTF8: "1"
    steps:
      # 改行を CRLF に変えずに取り出す (同梱物の sha256 の試験が Linux と同じ中身を見るため)。
      - name: 改行を変えない設定にする
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.21"
      - name: 依存を入れる (PDF の extras は入れない)
        run: uv sync --locked --group dev
      - name: ruff
        run: uv run ruff check .
      - name: pytest (PDF の試験は除く)
        run: uv run pytest -m "not pdf"
      - name: migration の差分が無いことを確かめる
        run: uv run python -m django makemigrations --check --dry-run
      - name: 空の DB に migrate する
        run: uv run python -m django migrate
      - name: 決まりの検査 (書き方の決まり) を部品のコードに回す
        run: uv run python -m django seizou_check src/seizou
