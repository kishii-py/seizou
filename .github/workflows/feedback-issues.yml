# seizou のフィードバックの画面から送られた Issue にラベルを付ける (本人の決め 11-07 09:1x。受け渡しの指示書の「Actions でラベル」)。
# 訳: 工場の口座はこのリポジトリに書き込む権限を持たないので、送るときに付けたラベル (from-seizou と種類) を GitHub が黙って外す。
#     Actions はリポジトリの権限でラベルを付けるので、送ったのが誰の口座でも付く。
# 見る物: 本文に「- 作品の版: seizou …」の行があれば「from-seizou」、「- 種類: <種類>」の行があればその種類のラベル
#         (どちらの行も feedback の services.export_markdown が必ず書く)。種類のラベルは 6 つ (feedback の KIND_CHOICES の表示名) だけ。
# ラベルは先に作ってある (gh label create。11-07 09:4x)。無いラベルは付けない (addLabels は無いラベルを作るが、作らせない)。
name: feedback-issues

on:
  issues:
    types: [opened, reopened, edited, closed, labeled, unlabeled, milestoned, demilestoned]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7.0.1
        with:
          script: |
            const body = context.payload.issue.body || "";
            const kinds = ["不具合", "決まりの反例", "決まりの提案", "業務の流れの違い", "要望", "使い方"];
            const labels = [];
            if (/^- 作品の版: seizou/m.test(body)) labels.push("from-seizou");
            const kind = body.match(/^- 種類: (.+)$/m);
            if (kind && kinds.includes(kind[1].trim())) labels.push(kind[1].trim());
            const current = (context.payload.issue.labels || []).map((label) => label.name);
            const missing = labels.filter((name) => !current.includes(name));
            if (missing.length === 0) return;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: missing,
            });

  # 盤 (GitHub の Projects「seizou フィードバック」= https://github.com/users/kishii-py/projects/1。本人の決め 11-07 09:1x〜09:4x。指示書2 の「カンバン」):
  # Issue が開いた・閉じた・開き直した・ラベルとマイルストーンが変わったときに、盤に足して (無ければ) 列 (Status) を決める。
  #   見送った = 対応しない (not_planned) か重複 (duplicate) で閉じた / 直した = それ以外で閉じた / 直している = 開いていてラベル「直している」/
  #   直す予定 = 開いていてマイルストーンがある / 受け付けた = それ以外の開いている物 (seizou の画面の盤の列の分け方と同じ)。
  # 既定の鍵 (GITHUB_TOKEN) は個人の口座の盤に書けないので、本人が project と public_repo の権限のトークン (classic「seizou-projects-board」。
  # 期限 2027-02-05) を秘密の値 PROJECTS_TOKEN に置いた (11-07 10:04)。この秘密の値は、盤を動かすこの 1 つの段の github-token にだけ渡す。
  # Issue の字 (題・本文・ラベル) は script の中で context.payload から受け取り、run: と script: の字に github.event.issue の式を埋め込まない
  # (Issue の字を式で埋め込むと、本文の字が script として動く穴になる)。盤・列・選択肢の id は公開の値。
  board:
    runs-on: ubuntu-latest
    steps:
      - name: 盤の列を決める
        uses: actions/github-script@v7.0.1
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN }}
          script: |
            const projectId = "PVT_kwHOA4Ax_s4BqjT1";
            const fieldId = "PVTSSF_lAHOA4Ax_s4BqjT1zho5-v4";
            const options = { 受け付けた: "cfe68a68", 直す予定: "cc2f6e6e", 直している: "6a602416", 直した: "42219d7a", 見送った: "e1c766e2" };
            const issue = context.payload.issue;
            const labels = (issue.labels || []).map((label) => label.name);
            let column = "受け付けた";
            if (issue.state === "closed") {
              column = ["not_planned", "duplicate"].includes(issue.state_reason) ? "見送った" : "直した";
            } else if (labels.includes("直している")) {
              column = "直している";
            } else if (issue.milestone) {
              column = "直す予定";
            }
            const added = await github.graphql(
              `mutation($projectId: ID!, $contentId: ID!) { addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) { item { id } } }`,
              { projectId, contentId: issue.node_id }
            );
            const itemId = added.addProjectV2ItemById.item.id;
            await github.graphql(
              `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) { updateProjectV2ItemFieldValue(input: {projectId: $projectId, itemId: $itemId, fieldId: $fieldId, value: {singleSelectOptionId: $optionId}}) { projectV2Item { id } } }`,
              { projectId, itemId, fieldId, optionId: options[column] }
            );
            core.info(`#${issue.number} → ${column}`);
