name: install

# 入れる所から画面が開くまでを、3 つの OS で通す (docs/getting-started.md の「触り方」の 1〜4 と同じ流れ)。
# 訳: Linux と Windows は試験だけで、手で通した確かめが無かった。実機の代わりに、ここで毎回通す。

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # 改行を CRLF に変えずに取り出す (windows.yml と同じ)。
      - name: 改行を変えない設定にする
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.21"
      # 使う人と同じ入れ方 (開発の道具と PDF の extras は入れない)。PYTHONUTF8 も置かない。
      - name: 入れる
        run: uv sync --locked
      - name: 作り物の 2 社を立てて、画面が開くまでを通す
        run: uv run python scripts/install_smoke.py
