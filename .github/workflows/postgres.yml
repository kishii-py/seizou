name: postgres

on:
  push:
  pull_request:

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seizou
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: tests.settings
      SEIZOU_TEST_DB: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: seizou
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.21"
      - name: WeasyPrint の OS の部品を入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libharfbuzz-subset0
      - name: 依存を入れる
        run: uv sync --locked --group dev --extra pdf
      - name: ruff
        run: uv run ruff check .
      - name: pytest
        run: uv run pytest
      - name: migration の差分が無いことを確かめる
        run: uv run python -m django makemigrations --check --dry-run
      - name: 空の DB に migrate する
        run: uv run python -m django migrate
